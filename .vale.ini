# The house style: Google's developer documentation style, plus our own
# rules in styles/OpenController and our vocabulary. `vale sync` fetches the
# Google package into styles/; `vale .` checks every page; `vale test`
# runs the rules' own tests. CI fails on errors and reports the rest.
StylesPath = styles
MinAlertLevel = suggestion
Packages = Google
Vocab = OpenController

[*.mdx]
BasedOnStyles = Vale, Google, OpenController
# Our heading rule is Google's with the console's labels as exceptions.
Google.Headings = NO
# Google rules that disagree with how the console and these pages are
# written: no contractions, no Oxford comma, acronyms the glossary
# defines, UI labels in their own case, logical punctuation, and words
# like "latest" that are the console's labels.
Google.Acronyms = NO
Google.Contractions = NO
Google.OxfordComma = NO
Google.WordListCase = NO
Google.WordList = NO
Google.Quotes = NO
Google.Timeless = NO
Google.Units = NO
Google.Parens = NO
Google.Colons = NO
Google.We = NO
# Reported, not enforced.
Google.Passive = suggestion
Google.Semicolons = suggestion
Google.Anthropomorphism = suggestion
Google.Will = suggestion
# Google's spelling list is reliable; Vale's dictionary is not for ours.
Vale.Spelling = NO

# The OpenAPI document: its title and every description are prose too.
# They come from the platform's annotations, so they are reported here
# and fixed there.
[api-reference/openapi.json]
BasedOnStyles = Vale, Google, OpenController
View = OpenAPI
Google.Headings = NO
# Enum values and identifiers appear lowercase in descriptions.
Vale.Terms = NO
Google.Acronyms = NO
Google.Contractions = NO
Google.OxfordComma = NO
Google.WordListCase = NO
Google.WordList = NO
Google.Quotes = NO
Google.Timeless = NO
Google.Units = NO
Google.Parens = NO
Google.Colons = NO
Google.We = NO
Google.Passive = suggestion
Google.Semicolons = suggestion
Google.Latin = warning
Google.EmDash = warning
Google.Spacing = warning
OpenController.Dash = warning
OpenController.Terms = warning
OpenController.Brand = warning
Vale.Spelling = NO
