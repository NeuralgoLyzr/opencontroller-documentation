# The exported site, served as its README asks: a page's address serves its
# index.html; the same address asked with the RSC header or the _rsc query,
# which the pages use to navigate without reloading, serves its index.txt as
# a React component stream; the build's assets are cached for a year, and
# the pages never.

map "$http_rsc|$arg__rsc" $oc_rsc {
    default 0;
    "~^1\|" 1;
    "~\|.+" 1;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location /_mintlify/export-assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location ~ /index\.txt$ {
        types {}
        default_type text/x-component;
        add_header Vary "RSC";
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location / {
        if ($oc_rsc) {
            rewrite ^/$ /index.txt last;
            rewrite ^/(.+?)/?$ /$1/index.txt last;
        }
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/index.html =404;
    }
}
