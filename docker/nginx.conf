# The exported site, served as its README asks, under /docs on the cell's own
# address: a page's address serves its index.html, the build's assets are
# cached for a year, and the pages never.

# Where a visitor's sign-in is remembered for a moment (gate.sh).
proxy_cache_path /tmp/oc-session-cache levels=1 keys_zone=oc_session:1m max_size=8m inactive=1m use_temp_path=off;

server {
    listen 8080;
    server_name _;
    server_tokens off;
    # A redirect names a path only: the address and port people use are the
    # cell's, not this server's.
    absolute_redirect off;
    root /usr/share/nginx/html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Nothing of the site comes from anywhere else, and this holds it to that.
    # unsafe-eval: the pages' framework evaluates their front matter; it loads nothing.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;

    # For probes: answers whatever the license says.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
    # The sign-in and the license (gate.sh). oc-gate-all.conf holds every file to
    # the sign-in; oc-gate-pages.conf holds the pages alone to the license,
    # where the sign-in is not asked.
    include /tmp/oc-gate-server*.conf;

    location /docs/_mintlify/assets/ {
        include /tmp/oc-gate-all*.conf;
        add_header Cache-Control "private, max-age=31536000, immutable";
    }
    location /docs/_mintlify/export-assets/ {
        include /tmp/oc-gate-all*.conf;
        add_header Cache-Control "private, max-age=31536000, immutable";
    }
    location /docs/fonts/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location = / {
        return 302 /docs/;
    }
    # A page as Markdown (docker/markdown.sh), shown as text in the browser.
    location ~ \.md$ {
        include /tmp/oc-gate-all*.conf;
        include /tmp/oc-gate-pages*.conf;
        default_type "text/plain; charset=utf-8";
        types { }
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'" always;
        try_files $uri =404;
    }
    location / {
        include /tmp/oc-gate-all*.conf;
        include /tmp/oc-gate-pages*.conf;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
        try_files $uri $uri/index.html =404;
    }
}
