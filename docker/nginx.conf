# The exported site, served as its README asks, under /docs on the cell's own
# address: a page's address serves its index.html, the build's assets are
# cached for a year, and the pages never.

server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Nothing of the site comes from anywhere else, and this holds it to that.
    # unsafe-eval: the pages' framework evaluates their front matter; it loads nothing.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;

    # For probes: answers whatever the license says.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
    # The license, when LICENSE_API_URL is set (license.sh).
    include /tmp/oc-license-server*.conf;

    location /docs/_mintlify/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location /docs/_mintlify/export-assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location /docs/fonts/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location = / {
        return 302 /docs/;
    }
    location / {
        include /tmp/oc-license-gate*.conf;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
        try_files $uri $uri/index.html =404;
    }
}
