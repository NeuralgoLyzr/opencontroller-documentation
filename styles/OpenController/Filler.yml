extends: existence
message: "'%s' adds nothing. Remove it."
level: warning
ignorecase: true
tokens:
  - simply
  - easily
  - please note
  - it should be noted
  - in order to
  - robust
  - seamless
  - seamlessly
  - powerful
  - leverage
tests:
  - name: flags filler
    input: Simply click Save.
    contains: "'Simply' adds nothing"
  - name: accepts plain prose
    input: Click Save.
    want: ""
