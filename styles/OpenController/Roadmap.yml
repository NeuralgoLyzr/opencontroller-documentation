extends: existence
message: "Document what exists. No roadmap or promises ('%s')."
level: error
ignorecase: true
tokens:
  - coming soon
  - roadmap
  - in a future release
  - will be added
  - planned for
tests:
  - name: flags a promise
    input: Azure support is coming soon.
    contains: "No roadmap or promises"
  - name: accepts a present fact
    input: Azure is supported.
    want: ""
