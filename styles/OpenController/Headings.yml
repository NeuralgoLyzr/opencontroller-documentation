extends: capitalization
# Google's heading rule, with the console's labels as exceptions.
message: "'%s' should use sentence-style capitalization."
link: "https://developers.google.com/style/capitalization#capitalization-in-titles-and-headings"
level: warning
scope: heading
match: $sentence
# No `indicators: [":"]` here. That makes Vale require a capital after a colon,
# which is the Microsoft convention this rule was originally copied from. This
# guide says the opposite: "the first word after a colon is generally
# lowercase" (developers.google.com/style/colons), and Colons.yml enforces
# exactly that. See issue #58.
exceptions:
  - Azure
  - CLI
  - Cosmos
  - Docker
  - Emmet
  - gRPC
  - I
  - Kubernetes
  - Linux
  - macOS
  - Marketplace
  - MongoDB
  - REPL
  - TypeScript
  - URLs
  - Visual
  - VS
  - Windows
  - JSON
  - Shadow AI
  - AI Inventory
  - Workload Identity Federation
  - LLM Gateway
  - Copilot Studio
  - Agent Builder
  - Vertex AI
  - MITRE ATLAS
  - OpenController
  - OpenController's
  - Ask Ctrl
  - Rekori
tests:
  - name: flags title case
    input: "## Connect The Studio"
    contains: "sentence-style capitalization"
  - name: accepts a label in a heading
    input: "## The Shadow AI page and Ask Ctrl"
    want: ""
