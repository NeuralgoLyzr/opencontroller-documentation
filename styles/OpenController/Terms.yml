# One term, one meaning: the product's own words, as the console shows them.
extends: substitution
message: "Say '%s', not '%s'."
level: error
ignorecase: true
swap:
  integration account: connection
  cloud account connection: connection
  tenant connection: connection
  unregistered agent: shadow agent
  virtual key token: virtual key
  api token: service-account key
  access token: service-account key
  trace database: trace store
  guard rail: guardrail
  guard rails: guardrails
  eval service: evals service
tests:
  - name: flags a near-miss for connection
    input: Add an integration account for AWS.
    contains: "Say 'connection', not 'integration account'."
  - name: flags guard rail
    input: Every guard rail has eleven checks.
    contains: "Say 'guardrail'"
  - name: accepts the term
    input: Add a connection for AWS.
    want: ""
