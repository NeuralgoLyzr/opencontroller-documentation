extends: script
message: "A long sentence. Keep it under 30 words, or split it."
level: warning
scope: sentence
script: |
  text := import("text")
  matches := []
  n := len(text.fields(scope))
  if n > 30 {
    matches = append(matches, {begin: 0, end: len(scope), message: "A sentence of " + string(n) + " words. Keep it under 30, or split it."})
  }
tests:
  - name: flags a long sentence
    input: The inventory lists every agent, model, tool, server, identity and memory that discovery found across every connected account, with the owner each platform names and the findings each asset has, so that one page answers what exists.
    contains: "words. Keep it under 30"
  - name: accepts a short one
    input: The inventory lists every asset.
    want: ""
