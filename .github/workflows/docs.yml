name: docs

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  # Style: Google's developer documentation style plus our rules and
  # vocabulary (.vale.ini, styles/). Errors fail the job; warnings and
  # suggestions are annotated on the pull request.
  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test the rules
        run: |
          curl -sSL https://github.com/vale-cli/vale/releases/download/v3.24.0/vale_3.24.0_Linux_64-bit.tar.gz | tar xz vale
          ./vale sync
          ./vale test --coverage styles/OpenController
      - uses: vale-cli/vale-action@v3
        with:
          version: 3.24.0
          files: all
          fail_on_error: true
          filter_mode: nofilter
          reporter: github-pr-check

  # Links and navigation: every link resolves, every page in docs.json
  # exists, every page is in docs.json, every page has a title.
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Pinned: an unpinned install takes whatever mint npm has just published, which once
      # named a dependency npm did not have yet. Move it with the local preview.
      - run: npm i -g mint@4.2.1084
      - run: mint broken-links
      - run: python3 scripts/check.py
      - run: python3 scripts/flags.py --check
      - run: python3 scripts/openapi.py --check
      - run: python3 scripts/atlas.py --check
      - run: python3 scripts/roles.py --check

  # The container: the site exported and served by nginx (Dockerfile), for a
  # cell to run its own copy. Every push to main publishes it to GitHub's
  # registry, tagged by commit and as latest; a pull request only builds it.
  image:
    runs-on: ubuntu-latest
    needs: [style, links]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/neuralgolyzr/opencontroller-documentation:${{ github.sha }}
            ghcr.io/neuralgolyzr/opencontroller-documentation:latest
