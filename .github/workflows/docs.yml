name: docs

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Every page builds and every link resolves.
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Pinned: an unpinned install takes whatever mint npm has just published, which once
      # named a dependency npm did not have yet. Move it with the local preview.
      - run: npm i -g mint@4.2.1084
      - run: mint validate
      - run: mint broken-links

  # The container: the site exported and served by nginx (Dockerfile), for a
  # customer's cell to run its own copy. A pull request only builds it. A push
  # to main publishes it to Lyzr Artifactory, the registry customers pull from,
  # as v0-<commit>; a cell pins the tag it runs.
  image:
    runs-on: ubuntu-latest
    needs: [links]
    permissions:
      contents: read
      id-token: write # GitHub's OIDC token, for the role below; no stored keys
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        if: github.event_name == 'push'
        with:
          role-to-assume: arn:aws:iam::897722707629:role/opencontroller-docs-publisher
          aws-region: us-east-1
      - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
        if: github.event_name == 'push'
      - name: Build, and on main push
        run: |
          image=897722707629.dkr.ecr.us-east-1.amazonaws.com/opencontroller/docs:v0-$(git rev-parse --short=12 HEAD)
          docker build -t "$image" .
          if [ "$GITHUB_EVENT_NAME" = push ]; then docker push "$image"; fi
